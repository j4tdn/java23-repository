<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Ex07 - CSS Flex Basic 01</title>

	<link rel="stylesheet" href="../css/base.css">
	
	<style>
		hr {
			margin: 50px 0;
		}

		.container {
			display: flex;
			flex-direction: row;
			justify-content: flex-start;
			align-items: baseline;

			width: 1200px;
			height: 600px;
			border: 2px dotted #88aa1b;

			.item {
				display: flex;

				height: 60px;

				background: #7caa1e;
				border: 1px solid #e7e8e9;
			}
		}

		.item:nth-child(2n+2) {

		}

		.item:nth-child(3) {
			height: 100px;
			align-self: center;
		}
