<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Student Web Page</title>
</head>
<body style="font-family: Arial, sans-serif; background:#f2f2f2; margin:20px;">

  <!-- Khung chính (bo góc + bóng) -->
  <div style="width:420px; margin:40px auto; border:1px solid #bdbdbd; border-radius:8px; background:#fff; box-shadow:0 2px 6px rgba(0,0,0,0.12); overflow:hidden;">

    <!-- Header (màu tối, chữ trắng) -->
    <div style="background:#444; color:#fff; padding:10px 0; text-align:center; font-weight:bold;">
      Student Web Page
    </div>

    <!-- Nội dung trong khung -->
    <div style="padding:18px;">
      <div style="color:#333; margin-bottom:12px;">Student Page - Add</div>

      <form>
        <!-- Input name -->
        <div style="margin-bottom:16px;">
          <input type="text" placeholder="Enter your name"
                 style="width:100%; box-sizing:border-box; padding:12px; font-size:14px; border:1px solid #999; border-radius:4px;">
        </div>

        <!-- Select class -->
        <div style="margin-bottom:18px;">
          <select style="width:100%; box-sizing:border-box; padding:12px; font-size:14px; border:1px solid #999; border-radius:4px;">
            <option>ClassA</option>
            <option>ClassB</option>
            <option>ClassC</option>
            <option>ClassD</option>
          </select>
        </div>

        <!-- Button SAVE -->
        <div style="margin-bottom:18px;">
          <button type="submit"
                  style="padding:10px 24px; font-size:14px; border:1px solid #222; background:#fff; cursor:pointer; border-radius:4px;">
            SAVE
          </button>
        </div>
      </form>

      <!-- Đường kẻ dày -->
      <hr style="border:none; height:3px; background:#222; margin:18px 0;">

      <!-- Link back -->
      <a href="index.html" style="color:#1a73e8; text-decoration:underline;">Back to Home Page</a>
    </div>
  </div>

</body>
</html>
